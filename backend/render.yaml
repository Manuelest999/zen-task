services:
  - type: web
    name: zentask-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT core.asgi:application
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render genera uno automáticamente
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "zentask-backend.onrender.com"   # ← cámbialo por tu URL real de Render
      - key: DATABASE_URL
        sync: false                # Lo pegas manualmente en el dashboard (tu Supabase URL)
      - key: CORS_ALLOWED_ORIGINS
        value: "https://zen-task.vercel.app"    # ← cámbialo por tu URL real de Vercel
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false                # Lo pegas manualmente en el dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false                # Lo pegas manualmente en el dashboard
      - key: DEFAULT_FROM_EMAIL
        sync: false                # Lo pegas manualmente en el dashboard
      - key: RESEND_API_KEY
        sync: false                # Si usas Resend, lo pegas manualmente
      - key: PYTHON_VERSION
        value: "3.12.0"
